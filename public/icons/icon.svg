<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definition of gradients and shadows -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#FFFBF7" />
      <stop offset="100%" stop-color="#FEDECC" />
    </radialGradient>
    <linearGradient id="bubbleEng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B9D" />
      <stop offset="100%" stop-color="#EE3A70" />
    </linearGradient>
    <linearGradient id="bubbleHin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAD60" />
      <stop offset="100%" stop-color="#FF8B3D" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#CA7842" flood-opacity="0.25" />
    </filter>
    <filter id="bubbleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#802000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background maskable safe zone wrapper -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Main visual icon container with soft card design -->
  <g filter="url(#softShadow)">
    <!-- Outer friendly speech base bubble -->
    <rect x="56" y="56" width="400" height="400" rx="96" fill="#FFFFFF" />
  </g>

  <!-- Bilingual Speech Bubbles overlapping playfully -->
  <g filter="url(#bubbleShadow)">
    <!-- English Bubble (Left / Pink) -->
    <g transform="translate(110, 160)">
      <!-- Bubble Body -->
      <path d="M 0 30 C 0 13.43 13.43 0 30 0 H 170 C 186.57 0 200 13.43 200 30 V 110 C 200 126.57 186.57 140 170 140 H 50 L 0 180 Z" fill="url(#bubbleEng)" />
      <!-- Alphabet Aa -->
      <text x="100" y="92" font-family="'Fredoka', 'Baloo 2', 'Inter', sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" text-anchor="middle">Aa</text>
    </g>

    <!-- Hindi Speech Bubble (Right / Orange) -->
    <g transform="translate(202, 230)">
      <!-- Bubble Body -->
      <path d="M 30 0 H 170 C 186.57 0 200 13.43 200 30 V 110 C 200 126.57 186.57 140 170 140 L 200 180 H 30 C 13.43 140 0 126.57 0 110 V 30 C 0 13.43 13.43 0 30 0 Z" fill="url(#bubbleHin)" />
      <!-- Devanagari Letter -->
      <text x="100" y="96" font-family="'Noto Sans Devanagari', 'Fredoka', 'Baloo 2', sans-serif" font-size="70" font-weight="800" fill="#FFFFFF" text-anchor="middle">अ</text>
    </g>
  </g>

  <!-- Tiny playful sound waves at the top right -->
  <path d="M 400 120 A 40 40 0 0 1 400 180" fill="none" stroke="#FF8B3D" stroke-width="12" stroke-linecap="round" />
  <path d="M 424 100 A 70 70 0 0 1 424 200" fill="none" stroke="#FF8B3D" stroke-width="12" stroke-linecap="round" opacity="0.6" />
</svg>
